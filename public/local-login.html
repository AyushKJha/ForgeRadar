<!doctype html><html lang="en" data-theme="nebula"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ForgeRadar · Local sign in</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/design.css"><link rel="stylesheet" href="/v3.css"><script src="/v3-login.js" defer></script></head><body class="auth-page"><main class="panel auth-panel v3-auth"><span class="tag">FORGERADAR / PRIVATE LOCAL WORKSPACE</span><h1>Build what matters.</h1><p>Sign in to your local workspace. Your profile and projects stay on this laptop.</p><form id="accountForm"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" minlength="12" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button></form><button id="switchMode" type="button">Create a local account</button><p id="authNotice" role="status" aria-live="polite"></p><p class="muted">Existing owner: use owner@forgeradar.local and your workshop password. New accounts have separate private profiles.</p></main></body></html>
