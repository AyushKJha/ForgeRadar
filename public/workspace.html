<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project workspace</title><link rel="stylesheet" href="workspace.css"><script type="module" src="workspace.js"></script></head><body><main><header class="hero"><span class="eyebrow">YOUR APPLICATION / PERSISTENT WORKSPACE</span><div class="hero-grid"><div><h1 id="title">Connecting…</h1><p id="description"></p></div><div class="hero-orbit" aria-hidden="true"><span></span><span></span><span></span></div></div><nav id="collections" aria-label="Collections"></nav><p id="notice" role="status" aria-live="polite"></p></header><div class="stats" id="stats" aria-label="Workspace overview"></div><div class="layout"><section class="entry-column"><form id="editor" class="panel"><span class="eyebrow">CREATE / UPDATE</span><h2 id="editorTitle">Add a record</h2><div id="fields"></div><div class="actions"><button id="save" type="submit">Save record</button><button id="reset" type="button">Clear form</button></div></form><details class="import-panel panel"><summary>Import records</summary><label for="importData">Paste a JSON array or CSV with the field names shown below</label><p id="importHelp"></p><textarea id="importData" rows="5" maxlength="60000"></textarea><button id="importRecords" type="button">Import into this collection</button></details></section><section class="results-column"><div class="toolbar panel"><label>Search records<input id="search" type="search" placeholder="Search any field"></label><label>Sort by<select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="name">Name A–Z</option></select></label><button id="export" type="button">Export JSON</button></div><p id="count"></p><div id="records"></div></section></div><footer>Node.js + SQLite · owner workspace · data is stored on your laptop worker</footer></main></body></html>
