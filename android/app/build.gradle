plugins { id 'com.android.application' }

dependencies { implementation 'androidx.activity:activity:1.10.1' }

android {
    namespace 'com.forgeradar.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.forgeradar.mobile'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.3.2'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('syncDebugApk') {
    dependsOn('assembleDebug')
    doLast {
        def apkFile = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk').get().asFile
        def forgeRadarRoot = rootProject.projectDir.parentFile
        [forgeRadarRoot, new File(forgeRadarRoot, 'public/download')].each { destination ->
            project.copy {
                from(apkFile)
                into(destination)
                rename { 'ForgeRadar-Android-debug.apk' }
            }
        }
    }
}
