plugins { id 'com.android.application' }

dependencies { implementation 'androidx.activity:activity:1.10.1' }

android {
    namespace 'com.forgeradar.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.forgeradar.mobile'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
